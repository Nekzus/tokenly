name: CI/CD & Publish - Tokenly

on:
  push:
    branches: [main, beta, alpha]
  pull_request:
    branches: [main, beta, alpha]

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: ["22"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & Format Check
        run: pnpm run lint

      - name: Run Vitest Suite
        run: pnpm run test

      - name: Build Library
        run: pnpm run build

  publish:
    name: OIDC Trusted Release to npm & GitHub
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
      packages: write
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/alpha') }}
    needs: [quality]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Git Notes
        run: git fetch origin +refs/notes/semantic-release:refs/notes/semantic-release || true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Package
        run: pnpm run build

      - name: Save previous version
        id: prev_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Run Semantic Release (Versioning & Changelog)
        run: pnpm run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check release status
        id: get_version
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          PREV_VERSION="${{ steps.prev_version.outputs.version }}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          if [ "$NEW_VERSION" = "$PREV_VERSION" ]; then
            echo "released=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No new version released by semantic-release."
          else
            echo "released=true" >> $GITHUB_OUTPUT
            echo "📦 New version released: $NEW_VERSION"
          fi

      - name: Publish Package to NPM (OIDC Trusted Publishing)
        if: steps.get_version.outputs.released == 'true'
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            pnpm publish --no-git-checks --provenance
          else
            pnpm publish --no-git-checks --provenance --tag ${{ github.ref_name }}
          fi

  docs:
    name: Deploy VitePress Documentation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [publish]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Documentation
        run: pnpm run docs:build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist