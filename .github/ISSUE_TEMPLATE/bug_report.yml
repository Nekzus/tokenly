name: Bug Report
description: Create a report to help us fix a bug in Tokenly
title: "fix(core): "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in Tokenly! Please fill out the form below to help us reproduce and resolve the issue quickly.
  - type: input
    id: environment
    attributes:
      label: Environment & Versions
      description: Node.js version, OS, pnpm version, and Tokenly package version
      placeholder: "Node.js 22.x, Windows 11 / Ubuntu 24.04, pnpm 10.5.2, @nekzus/tokenly 1.5.4"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce & Code Snippet
      description: Provide a minimal code snippet or step-by-step instructions to reproduce the issue.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
