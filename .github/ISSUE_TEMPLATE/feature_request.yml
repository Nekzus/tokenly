name: Feature Request
description: Suggest an idea or feature enhancement for Tokenly
title: "feat(core): "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggesting a new feature or improvement for Tokenly.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is (e.g., I'm always frustrated when...)
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false
